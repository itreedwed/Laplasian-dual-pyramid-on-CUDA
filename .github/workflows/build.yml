name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04, CUDA 13.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit, OpenCV and Ninja
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 libopencv-dev ninja-build
          echo "/usr/local/cuda-13.2/bin" >> "$GITHUB_PATH"

      # GitHub runners have no GPU, so the architecture is set explicitly
      # instead of "native" and the program is only checked to start.
      - name: Configure
        run: cmake --preset release-system -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build
        run: cmake --build --preset release-system

      - name: Smoke test
        run: ./build/release-system/laplacian_filter --help
